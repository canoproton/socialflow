name: meu_backend
description: "SocialFlow - Sistema de Gestão"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔹 Supabase
  supabase_flutter: ^2.0.0

  # 🔹 Navegação
  go_router: ^13.0.0

  # 🔹 Gerenciamento de Estado
  provider: ^6.0.0

  # 🔹 Utilitários
  intl: ^0.18.0
  image_picker: ^1.0.0
  file_picker: ^8.0.0
  printing: ^5.11.0
  pdf: ^3.10.0

  # 🔹 Interface
  flutter_svg: ^2.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/